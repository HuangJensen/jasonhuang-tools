<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JasonHuang的工具集</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0f172a 100%);
    min-height: 100vh;
    color: #e2e8f0;
  }
  .layout { display: flex; min-height: 100vh; max-width: 1100px; margin: 0 auto; }

  /* 左侧作者栏 */
  .author {
    width: 260px; flex-shrink: 0;
    background: rgba(255,255,255,0.04);
    border-right: 1px solid rgba(255,255,255,0.08);
    padding: 40px 28px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    position: sticky; top: 0; height: 100vh;
  }
  .avatar {
    width: 84px; height: 84px; border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; color: #fff;
    box-shadow: 0 8px 24px rgba(56,189,248,0.35);
  }
  .author h2 { margin-top: 18px; font-size: 20px; color: #fff; }
  .author .role { margin-top: 6px; font-size: 13px; color: #94a3b8; }
  .quote {
    margin-top: 28px; padding: 18px 14px;
    border-left: 3px solid #38bdf8;
    background: rgba(56,189,248,0.08);
    border-radius: 8px;
    font-size: 14px; line-height: 1.9; color: #cbd5e1;
  }
  .quote .line { display: block; }

  /* 右侧主内容 */
  .content { flex: 1; padding: 44px 40px 60px; }

  .hero { text-align: center; padding: 30px 0 8px; }
  .hero h1 {
    font-size: 40px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero .madeby {
    display: inline-block; margin-top: 16px;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    color: #fff; font-size: 13px; padding: 5px 16px; border-radius: 999px;
    letter-spacing: 1px;
  }

  .section { margin-top: 40px; }
  .section h2 {
    font-size: 18px; color: #38bdf8; letter-spacing: 3px;
    padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 18px; }
  .card {
    display: block; text-decoration: none;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; padding: 22px 20px;
    transition: transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .card:hover { transform: translateY(-4px); border-color: #38bdf8; background: rgba(56,189,248,0.08); }
  .card-title { font-size: 18px; font-weight: 600; color: #fff; }
  .card-desc { margin-top: 8px; font-size: 13px; color: #94a3b8; line-height: 1.6; }
  .card .go { display: inline-block; margin-top: 12px; font-size: 13px; color: #38bdf8; }
  .card.coming { opacity: 0.55; cursor: default; }
  .card.coming:hover { transform: none; border-color: rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); }

  @media (max-width: 820px) {
    .layout { flex-direction: column; }
    .author { width: 100%; height: auto; position: static; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 28px 20px; }
    .quote { max-width: 420px; }
    .content { padding: 28px 20px 50px; }
    .hero h1 { font-size: 30px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="author">
    <div class="avatar">JH</div>
    <h2>JasonHuang</h2>
    <p class="role">工具作者</p>
    <p class="quote">
      <span class="line">工具在手，边界在后。</span>
      <span class="line">每多一种工具，你就多一分自由。</span>
    </p>
  </aside>
  <main class="content">
    <header class="hero">
      <h1>JasonHuang的工具集</h1>
      <span class="madeby">JasonHuang出品</span>
    </header>

    <section class="section">
      <h2>英 语</h2>
      <div class="cards">
        <a class="card" href="https://dictionary-gpt.pages.dev" target="_blank" rel="noopener">
          <div class="card-title">在线词典</div>
          <div class="card-desc">76 万词条 · 音标 / 词性 / 考试标签 / 词形变化 · 浏览器本地快速搜索</div>
          <span class="go">打开 →</span>
        </a>
        <a class="card" id="english-link" href="#" target="_blank" rel="noopener">
          <div class="card-title">英语学习</div>
          <div class="card-desc">语法 · 好句 / 作文模板 · 背诵 + 应用</div>
          <span class="go">打开 →</span>
        </a>
      </div>
    </section>

    <section class="section">
      <h2>数 学</h2>
      <div class="cards">
        <div class="card coming">
          <div class="card-title">数学可视化</div>
          <div class="card-desc">线性代数 · 微积分可视化（建设中，敬请期待）</div>
        </div>
      </div>
    </section>
  </main>
</div>
<script>
  // 英语学习网站链接占位：上线后把下面的网址填进去即可
  // document.getElementById('english-link').href = 'https://你的英语学习网址';
</script>
</body>
</html>
